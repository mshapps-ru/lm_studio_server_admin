<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LM Studio Server Admin</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="screen">
        <div class="login-card">
            <h1>LM Studio Server Admin</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
                <div id="login-error" class="error-message"></div>
            </form>
        </div>
    </div>

    <!-- Main App -->
    <div id="app-screen" class="screen hidden">
        <header class="header">
            <h1>LM Studio Server Admin</h1>
            <div class="header-actions">
                <button id="logout-btn" class="btn btn-secondary btn-sm">Exit</button>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="home">Home</button>
            <button class="tab" data-tab="settings">Settings</button>
        </nav>

        <main class="content">
            <!-- Home Tab -->
            <div id="home-tab" class="tab-content">
                <div class="card">
                    <h2>LM Studio Server Status</h2>
                    <div class="status-display">
                        <span id="status-badge" class="badge badge-unknown">Unknown</span>
                        <span id="status-message">Loading...</span>
                    </div>
                    <div class="actions">
                        <button id="start-btn" class="btn btn-success">Start</button>
                        <button id="stop-btn" class="btn btn-danger">Stop</button>
                    </div>
                </div>

                <!-- LM Studio Connection Info -->
                <div class="card">
                    <h2>LM Studio Connection</h2>
                    <div class="connection-info">
                        <div class="info-row">
                            <span class="info-label">Port:</span>
                            <span id="lmstudio-port">—</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Model:</span>
                            <span id="lmstudio-model">—</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Status:</span>
                            <span id="lmstudio-connection-status">—</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Settings Tab -->
            <div id="settings-tab" class="tab-content">
                <div class="card">
                    <h2>Admin Credentials</h2>
                    <form id="admin-credentials-form">

                        <div class="form-group">
                            <label for="settings-password">Password <small>(leave blank to keep current)</small></label>
                            <input type="password" id="settings-password" name="password">
                        </div>
                        <div class="form-group">
                            <label for="settings-password-confirm">Confirm Password</label>
                            <input type="password" id="settings-password-confirm" name="passwordConfirm">
                        </div>
                        <button type="submit" class="btn btn-primary">Save Password</button>
                    </form>
                </div>

                <div class="card">
                    <h2>Application Port & Verbose Logging</h2>
                    <form id="port-settings-form">
                        <div class="form-group">
                            <label for="settings-port">Port</label>
                            <input type="number" id="settings-port" name="port" min="1" max="65535" required>
                        </div>
                        <div class="form-group checkbox-inline">
                            <label for="verbose-logging">Verbose Logging</label>
                            <input type="checkbox" id="verbose-logging" name="verboseLogging">
                        </div>
                        <div id="port-warning" class="warning hidden">
                            Changing the port requires a server restart to take effect.
                        </div>
                        <button type="submit" class="btn btn-primary">Save Port</button>
                    </form>
                </div>

                <div class="card">
                    <h2>LM Studio Settings</h2>
                    <form id="lmstudio-settings-form">
                        <div class="form-group">
                            <label for="settings-lmstudio-port">LM Studio Server Port</label>
                            <div class="input-with-button">
                                <input type="number" id="settings-lmstudio-port" name="lmStudioPort" min="1" max="65535" required>
                                <button type="button" id="auto-detect-port-btn" class="btn btn-secondary btn-sm">Auto-detect</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="settings-bind-address">Bind Address</label>
                            <input type="text" id="settings-bind-address" name="bindAddress" placeholder="0.0.0.0">
                        </div>
                        <button type="submit" class="btn btn-primary">Save LM Studio Settings</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/home.js"></script>
    <script src="/js/settings.js"></script>
</body>
</html>
