<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LM Studio Server Admin</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="screen">
        <div class="login-card">
            <h1>LM Studio Server Admin</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
                <div id="login-error" class="error-message"></div>
            </form>
        </div>
    </div>

    <!-- Main App -->
    <div id="app-screen" class="screen hidden">
        <header class="header">
            <h1>LM Studio Server Admin</h1>
            <div class="header-actions">
                <button id="logout-btn" class="btn btn-secondary btn-sm">Exit</button>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="home">Home</button>
            <button class="tab" data-tab="settings">Settings</button>
        </nav>

        <main class="content">
            <!-- Home Tab -->
            <div id="home-tab" class="tab-content">
                <div class="card">
                    <h2>LM Studio Server Status</h2>
                    <div class="status-display">
                        <span id="status-badge" class="badge badge-unknown">Unknown</span>
                        <span id="status-message">Loading...</span>
                    </div>
                    <div class="actions">
                        <button id="start-btn" class="btn btn-success">Start</button>
                        <button id="stop-btn" class="btn btn-danger">Stop</button>
                    </div>
                </div>
            </div>

            <!-- Settings Tab -->
            <div id="settings-tab" class="tab-content">
                <div class="card">
                    <h2>Settings</h2>
                    <form id="settings-form">
                        <div class="form-group">
                            <label for="settings-username">Username</label>
                            <input type="text" id="settings-username" name="username" required>
                        </div>
                        <div class="form-group">
                            <label for="settings-password">Password <small>(leave blank to keep current)</small></label>
                            <input type="password" id="settings-password" name="password">
                        </div>
                        <div class="form-group">
                            <label for="settings-port">Port</label>
                            <input type="number" id="settings-port" name="port" min="1" max="65535" required>
                        </div>
                        <div id="port-warning" class="warning hidden">
                            Changing the port requires a server restart to take effect.
                        </div>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/home.js"></script>
    <script src="/js/settings.js"></script>
</body>
</html>
